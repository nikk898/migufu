<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIGUFU - Gestão MIGUFU (Validações)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../components/navbar.css">
  <link rel="stylesheet" href="../components/cabecalho-pagina.css">
  <link rel="stylesheet" href="../components/modal.css">
  <link rel="stylesheet" href="../components/card-val-certificado.css?v=2">

  <style>
    
    .nav-abas {
      display: flex;
      gap: 32px;
      border-bottom: 2px solid #e4e7ec;
      margin-bottom: 24px;
      width: 100%;
    }

    .nav-abas__item {
      padding: 8px 4px 12px;
      font-size: 16px;
      font-weight: 700;
      color: #667085; 
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s ease;
    }

    .nav-abas__item:hover {
      color: #076eb8;
    }

    
    .nav-abas__item.is-ativo {
      color: #076eb8;
      border-bottom-color: #076eb8;
    }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <div id="cabecalho"></div>

  <main class="conteudo">
    
    <nav class="nav-abas" aria-label="Abas da Gestão MIGUFU">
      <a class="nav-abas__item is-ativo" href="admin-validacao.html">VALIDAÇÕES</a>
      <a class="nav-abas__item" href="admin-associacao.html">ASSOCIAÇÕES</a>
    </nav>

    <section class="admin__secao">
      <h2 class="subtitulo" style="margin-bottom: var(--esp-3);">Certificados Pendentes</h2>

      
      <div class="inst__busca" style="max-width: 320px; margin-bottom: var(--esp-4);">
        <svg class="icone inst__busca-icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <label class="sr-only" for="busca-val">Buscar por nome, e-mail ou CPF</label>
        <input type="search" class="campo__entrada" id="busca-val" data-val="busca"
               placeholder="Buscar por nome, e-mail ou CPF..." autocomplete="off">
      </div>

      
      <ul class="card-val__lista" id="lista-validacao"></ul>
    </section>
  </main>

  <script src="../components/icones.js"></script>
  <script src="../components/navbar.js"></script>
  <script src="../components/cabecalho-pagina.js"></script>
  <script src="../components/modal.js"></script>
  <script src="../components/card-val-certificado.js"></script>
  <script src="../js/admin-validacao.js"></script>
</body>
</html>
