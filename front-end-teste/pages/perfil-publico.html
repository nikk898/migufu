<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIGUFU - Perfil público</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../components/navbar.css" />
    <link rel="stylesheet" href="../css/paginas/perfil.css" />
    <link rel="stylesheet" href="../css/paginas/perfil-publico.css" />
  </head>
  <body class="pagina-perfil">
    <div id="navbar"></div>

    <main class="conteudo perfil" id="perfil-publico-raiz">
      <header class="perfil__cabecalho">
        <a class="perfil__voltar" id="perfil-publico-voltar" href="estudante.html"
          aria-label="Voltar para o início">←</a>
        <h1 class="titulo-principal" id="perfil-publico-titulo">Perfil público</h1>

        <div class="perfil__marca" aria-label="MIGUFU">
          <img src="../assets/img/logo-migufu.png" alt="" />
          <img src="../assets/img/logo-migufu-texto.png" alt="MIGUFU" />
        </div>
      </header>

      <p class="card perfil-publico__erro" id="perfil-publico-erro" role="status" hidden></p>

      <div class="perfil__grade" id="perfil-publico-conteudo" hidden>
        <article class="card perfil__cartao">
          <div class="perfil__foto-area">
            <div class="perfil__avatar" id="perfil-publico-avatar" aria-hidden="true"></div>
          </div>
          <h2 class="perfil__nome" id="perfil-publico-nome"></h2>
          <h3 id="perfil-publico-bio-titulo">Sobre mim</h3>
          <p class="perfil__bio" id="perfil-publico-bio"></p>
          <h3 class="perfil__interesses-titulo" id="perfil-publico-interesses-titulo">Meus interesses</h3>
          <div class="perfil__tags" id="perfil-publico-interesses"></div>
        </article>

        <section class="perfil__dados">
          <h2 class="perfil__secao-titulo" id="perfil-publico-dados-titulo">Informações públicas</h2>
          <div class="card perfil__dados-card">
            <h3 id="perfil-publico-academico-titulo">Dados acadêmicos</h3>
            <div class="perfil__dados-lista" id="perfil-publico-dados"></div>
          </div>
        </section>
      </div>
    </main>

    <script src="../components/icones.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/perfil-publico.js"></script>
  </body>
</html>
