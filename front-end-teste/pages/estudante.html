<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIGUFU - Início do Estudante Internacional</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../components/navbar.css" />
    <link rel="stylesheet" href="../css/paginas/voluntario.css" />
    <link rel="stylesheet" href="../css/paginas/estudante.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <main class="conteudo">
      <div class="coluna estudante__pagina">
        <!-- Cabeçalho e seletor de idioma -->
        <header class="estudante__cabecalho">
          <h1 class="titulo-principal estudante__saudacao">
            Olá, Jean Martin!
          </h1>

          <div class="estudante__idioma">
            <label class="sr-only" for="idioma-interface">
              Idioma da interface
            </label>

            <select id="idioma-interface" aria-label="Idioma da interface">
              <option value="pt" selected>🌐 PT</option>
              <option value="en">🌐 EN</option>
              <option value="es">🌐 ES</option>
            </select>
          </div>

          <span
            class="chip chip--sucesso estudante__status"
            id="estudante-status"
          >
            <span class="chip__ponto" aria-hidden="true"></span>
            <span id="estudante-status-texto"> Migufu Encontrado! </span>
          </span>
        </header>

        <!-- Seção de MIGUFUS -->
        <section class="vol__secao" aria-labelledby="titulo-migufus">
          <h2 class="subtitulo" id="titulo-migufus">Meus Migufus</h2>

          <!-- Estado: sem voluntários associados -->
          <div class="estudante__vazio" id="estudante-vazio" hidden>
            <svg
              class="icone estudante__vazio-icone"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M12 12.75c1.63 0 3.07.39 4.24.9 1.08.48 1.76 1.56 1.76 2.73V18H6v-1.61c0-1.18.68-2.26 1.76-2.73 1.17-.52 2.61-.91 4.24-.91zM4 13c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm1.13 1.1c-.37-.06-.74-.1-1.13-.1-.99 0-1.93.21-2.78.58C.48 14.9 0 15.62 0 16.43V18h4.5v-1.61c0-.83.23-1.61.63-2.29zM20 13c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm4 3.43c0-.81-.48-1.53-1.22-1.85-.85-.37-1.79-.58-2.78-.58-.39 0-.76.04-1.13.1.4.68.63 1.46.63 2.29V18H24v-1.57zM12 6c1.66 0 3 1.34 3 3s-1.34 3-3 3-3 .9-3 3-3z"
              />
            </svg>

            <p class="texto" id="estudante-vazio-texto">
              Você ainda não possui Migufus vinculados. Aguarde a validação de
              um administrador.
            </p>
          </div>

          <!-- Estado: voluntários associados -->
          <div
            class="vol__lista estudante__lista"
            id="lista-mentores"
            aria-live="polite"
          ></div>
        </section>
      </div>
    </main>

    <script src="../components/icones.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../js/estudante.js"></script>
  </body>
</html>
