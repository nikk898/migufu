<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIGUFU - Ajuda e Suporte (Resolvidos)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../components/navbar.css">
  <link rel="stylesheet" href="../components/cabecalho-pagina.css">
  <link rel="stylesheet" href="../components/modal.css">
  <link rel="stylesheet" href="../components/card-chamado.css">
  <link rel="stylesheet" href="../components/paginacao.css">
  <link rel="stylesheet" href="../css/paginas/admin-suporte.css">
</head>
<style>
    @media (min-width: 900px) {
      .suporte__abas {
        margin-top: -70px !important; 
        position: relative;
        z-index: 2;
      }
    }
</style>
<body>
  <div id="navbar"></div>
  <div id="cabecalho"></div>

  <main class="conteudo" data-status="resolvido">
    <div class="suporte" id="suporte">

      <nav class="suporte__abas" aria-label="Abas de Ajuda e Suporte">
        <a class="suporte__aba" href="admin-suporte.html">PENDENTES</a>
        <a class="suporte__aba is-ativo" href="admin-suporte-resolvidos.html">RESOLVIDOS</a>
      </nav>

      <section class="suporte__lista-coluna" aria-label="Lista de chamados">
        <div class="suporte__busca">
          <svg class="icone suporte__busca-icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <label class="sr-only" for="busca-chamado">Buscar por nome ou e-mail</label>
          <input type="search" class="campo__entrada" id="busca-chamado"
                 placeholder="Buscar por nome, e-mail ou CPF..." autocomplete="off">
        </div>
        <ul class="suporte__lista" id="lista-chamados"></ul>
        <div class="suporte__paginacao" id="paginacao"></div>
      </section>

      <section class="suporte__detalhe-coluna" aria-label="Detalhes do chamado">
        <h2 class="suporte__titulo-detalhe">Detalhes do Chamado</h2>
        <div id="detalhe-chamado"></div>
      </section>

    </div>
  </main>

  <script src="../components/icones.js"></script>
  <script src="../components/navbar.js"></script>
  <script src="../components/cabecalho-pagina.js"></script>
  <script src="../components/modal.js"></script>
  <script src="../components/card-chamado.js"></script>
  <script src="../components/paginacao.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin-suporte.js"></script>
</body>
</html>
