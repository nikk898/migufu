<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIGUFU - Gestão de Instituições</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../components/navbar.css">
  <link rel="stylesheet" href="../components/cabecalho-pagina.css">
  <link rel="stylesheet" href="../components/modal.css">
  <link rel="stylesheet" href="../css/paginas/mestre-instituicoes.css">
</head>
<body>
  <!-- Navbar reutilizável (components/navbar.js). No mobile o cabeçalho é o da página -->
  <div id="navbar"></div>
  <div id="cabecalho"></div>

  <main class="conteudo inst">
    <button type="button" class="botao botao--primario inst__adicionar" data-inst="adicionar">
      Adicionar instituição
    </button>

    <div class="inst__busca">
      <svg class="icone inst__busca-icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <label class="sr-only" for="busca">Buscar instituições</label>
      <input type="search" class="campo__entrada" id="busca" data-inst="busca"
             placeholder="Buscar por nome, e-mail ou CPF..." autocomplete="off">
    </div>

    <ul class="inst__lista" data-inst="lista"></ul>
    <p class="texto inst__vazio" data-inst="vazio" role="status" hidden>Nenhuma instituição encontrada.</p>

    <!-- Botão flutuante (mobile) -->
    <button type="button" class="inst__fab" data-inst="fab" aria-label="Adicionar instituição">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
  </main>

  <script src="../components/icones.js"></script>
  <script src="../components/navbar.js"></script>
  <script src="../components/cabecalho-pagina.js"></script>
  <script src="../components/modal.js"></script>
  <script src="../js/mestre-instituicoes.js"></script>
</body>
</html>
